<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanco's Great Escape: Money Maker</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Courier New', monospace; touch-action: none; }
        canvas { display: block; background: linear-gradient(#001, #003); }
        #ui { position: absolute; top: 10px; left: 10px; color: #0f0; font-size: 20px; pointer-events: none; }
        #note-ui { position: absolute; top: 40px; left: 10px; color: #d4af37; font-size: 20px; pointer-events: none; }
    </style>
</head>
<body>

<div id="ui">DISTANCE: 0m</div>
<div id="note-ui">NOTES: 0 ♪</div>

<script>
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
document.body.appendChild(canvas);

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- CONNECTED DATA ---
const playerColor = localStorage.getItem('active_skin_hex') || '#0f0';
let totalNotes = parseInt(localStorage.getItem('notes_collected') || 0);

let score = 0;
let notesInRun = 0;
let gameActive = true;
const gravity = 0.8;

const player = {
    x: 50,
    y: canvas.height - 100,
    w: 30,
    h: 50,
    dy: 0,
    jumpForce: -15,
    grounded: false
};

const obstacles = [];
const notes = [];

function spawnObstacle() {
    if (!gameActive) return;
    obstacles.push({ x: canvas.width, w: 40, h: 40 + Math.random() * 40, speed: 7 + (score/1000) });
    setTimeout(spawnObstacle, 1500 - (score/500));
}

// BUFFED NOTE SPAWNING: Bigger and more frequent
function spawnNote() {
    if (!gameActive) return;
    notes.push({ 
        x: canvas.width, 
        y: canvas.height - 100 - Math.random() * 200, 
        size: 25, // Increased size
        speed: 5 
    });
    // Spawns every 1-2 seconds instead of 3-5
    setTimeout(spawnNote, 1000 + Math.random() * 1000); 
}

function update() {
    if (!gameActive) return;

    score++;
    document.getElementById('ui').innerText = `DISTANCE: ${Math.floor(score/10)}m`;

    player.dy += gravity;
    player.y += player.dy;

    if (player.y + player.h > canvas.height - 50) {
        player.y = canvas.height - 50 - player.h;
        player.dy = 0;
        player.grounded = true;
    }

    // Update Obstacles
    obstacles.forEach((obs, i) => {
        obs.x -= obs.speed;
        if (obs.x + obs.w < 0) obstacles.splice(i, 1);
        if (player.x < obs.x + obs.w && player.x + player.w > obs.x && player.y < canvas.height - 50 && player.y + player.h > canvas.height - 50 - obs.h) {
            gameOver();
        }
    });

    // Update Notes
    notes.forEach((n, i) => {
        n.x -= n.speed;
        if (n.x + n.size < 0) notes.splice(i, 1);
        
        // Better hitbox for bigger notes
        if (player.x < n.x + n.size && player.x + player.w > n.x && player.y < n.y + n.size && player.y + player.h > n.y) {
            notes.splice(i, 1);
            notesInRun++;
            totalNotes++;
            localStorage.setItem('notes_collected', totalNotes); // SAVE TO HUB
            document.getElementById('note-ui').innerText = `NOTES: ${notesInRun} ♪`;
        }
    });

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Floor
    ctx.fillStyle = '#333';
    ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

    // Player (uses Hub Skin)
    ctx.fillStyle = playerColor;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Obstacles
    ctx.fillStyle = '#f00';
    obstacles.forEach(obs => {
        ctx.fillRect(obs.x, canvas.height - 50 - obs.h, obs.w, obs.h);
    });

    // Notes (Glowing and Gold)
    notes.forEach(n => {
        ctx.shadowBlur = 15;
        ctx.shadowColor = "gold";
        ctx.fillStyle = "#f1c40f";
        ctx.font = `${n.size}px Arial`;
        ctx.fillText("♪", n.x, n.y);
        ctx.shadowBlur = 0;
    });
}

function gameOver() {
    gameActive = false;
    // Save high score
    const best = localStorage.getItem('sanco_best') || 0;
    if (score > best) localStorage.setItem('sanco_best', score);

    alert(`GAME OVER\nDistance: ${Math.floor(score/10)}m\nNotes Collected: ${notesInRun}\nTotal for Shop: ${totalNotes}`);
    window.location.href = 'index.html'; // Direct back to Hub
}

// Controls
function jump() {
    if (player.grounded) {
        player.dy = player.jumpForce;
        player.grounded = false;
    }
}

window.addEventListener('keydown', (e) => { if(e.code === 'Space' || e.code === 'ArrowUp') jump(); });
window.addEventListener('touchstart', (e) => { e.preventDefault(); jump(); });

spawnObstacle();
spawnNote();
update();
</script>
</body>
</html>
