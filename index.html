<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sanco's Great Escape - Retro Edition</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: white; }
        canvas { display: block; background: #87CEEB; } /* Sky Blue */
        #ui { position: absolute; top: 20px; left: 20px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; color: #fff; pointer-events: none; }
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 30px; border: 4px solid #d4af37;
            border-radius: 0px; text-align: center; display: none; width: 350px; box-shadow: 0 0 20px #000;
        }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-weight: bold; text-decoration: none; cursor: pointer; border: none; font-size: 16px; text-transform: uppercase; }
        .yt-btn { background: #ff0000; color: white; }
        .esofa-btn { background: #d4af37; color: black; }
        .retry-btn { background: #555; color: #fff; }
    </style>
</head>
<body>

<div id="ui">DIST: <span id="dist">0</span>m | NOTES: <span id="notes">0</span></div>

<div id="game-over">
    <h1 style="color:#d4af37; margin-top:0;">WILDERNESS CLIPPED!</h1>
    <p id="final-stats"></p>
    <hr border="1" color="#333">
    <a class="btn yt-btn" href="https://www.youtube.com/@SancoOutdoors" target="_blank">🎬 SUB TO SANCO</a>
    <a class="btn esofa-btn" href="https://www.sanangelogives.org/organization/emmanuelschooloffinearts" target="_blank">🎻 TIP ESOFA</a>
    <button class="btn retry-btn" onclick="location.reload()">RETRY</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let notesCollected = 0;
let gameActive = true;
let speed = 8;
let frame = 0;

const groundY = canvas.height - 100;
const player = { x: 80, y: groundY - 60, w: 40, h: 60, dy: 0, jump: -16, onGround: false };
const obstacles = [];
const notes = [];

window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'ArrowUp') && player.onGround) {
        player.dy = player.jump;
        player.onGround = false;
    }
});

function drawExplorer(x, y) {
    ctx.fillStyle = "#ffdbac"; // Skin
    ctx.fillRect(x + 10, y, 20, 20); // Head
    ctx.fillStyle = "#5d4037"; // Hat
    ctx.fillRect(x + 5, y, 30, 5);
    ctx.fillRect(x + 10, y - 5, 20, 10);
    ctx.fillStyle = "#2e7d32"; // Green Shirt
    ctx.fillRect(x + 8, y + 20, 24, 25);
    ctx.fillStyle = "#3e2723"; // Boots
    let walk = Math.sin(frame * 0.2) * 5;
    ctx.fillRect(x + 8, y + 45, 10, 15 + walk); 
    ctx.fillRect(x + 22, y + 45, 10, 15 - walk);
}

function spawn() {
    if (!gameActive) return;
    
    // Spawn Trees or Birds
    if (Math.random() < 0.015) {
        let type = Math.random() > 0.4 ? 'tree' : 'bird';
        if (type === 'tree') {
            obstacles.push({ x: canvas.width, y: groundY - 80, w: 30, h: 80, type: 'tree' });
        } else {
            obstacles.push({ x: canvas.width, y: groundY - 140, w: 40, h: 30, type: 'bird' });
        }
    }

    if (Math.random() < 0.01) {
        notes.push({ x: canvas.width, y: groundY - 180, r: 12 });
    }
    setTimeout(spawn, 100);
}

function update() {
    if (!gameActive) return;
    frame++;
    score++;
    speed += 0.002;
    document.getElementById('dist').innerText = Math.floor(score/10);
    document.getElementById('notes').innerText = notesCollected;

    player.dy += 0.8;
    player.y += player.dy;

    if (player.y > groundY - player.h) {
        player.y = groundY - player.h;
        player.dy = 0;
        player.onGround = true;
    }

    obstacles.forEach((obs, i) => {
        obs.x -= speed;
        // Collision logic (pixel-perfect-ish)
        if (player.x < obs.x + obs.w - 5 && player.x + player.w - 5 > obs.x &&
            player.y < obs.y + obs.h && player.y + player.h > obs.y) {
            gameActive = false;
            showEnd();
        }
        if (obs.x < -100) obstacles.splice(i, 1);
    });

    notes.forEach((n, i) => {
        n.x -= speed;
        if (Math.abs(player.x - n.x) < 40 && Math.abs(player.y - n.y) < 60) {
            notesCollected++;
            notes.splice(i, 1);
        }
    });

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Ground
    ctx.fillStyle = '#228B22'; // Grass
    ctx.fillRect(0, groundY, canvas.width, 100);
    ctx.fillStyle = '#1a5e1a';
    ctx.fillRect(0, groundY, canvas.width, 5);

    drawExplorer(player.x, player.y);

    obstacles.forEach(obs => {
        if (obs.type === 'tree') {
            ctx.fillStyle = '#5d4037'; // Trunk
            ctx.fillRect(obs.x + 10, obs.y + 40, 10, 40);
            ctx.fillStyle = '#1b5e20'; // Leaves
            ctx.beginPath();
            ctx.moveTo(obs.x - 10, obs.y + 45);
            ctx.lineTo(obs.x + 15, obs.y);
            ctx.lineTo(obs.x + 40, obs.y + 45);
            ctx.fill();
        } else {
            // Bird
            ctx.fillStyle = '#000';
            let wing = Math.sin(frame * 0.3) * 10;
            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y);
            ctx.lineTo(obs.x + 20, obs.y + wing);
            ctx.lineTo(obs.x + 40, obs.y);
            ctx.stroke();
            ctx.fillRect(obs.x + 15, obs.y - 5, 10, 10); // Bird head
        }
    });

    ctx.fillStyle = '#d4af37';
    notes.forEach(n => {
        ctx.font = "24px Arial";
        ctx.fillText("♪", n.x, n.y);
    });
}

function showEnd() {
    document.getElementById('final-stats').innerText = `DIST: ${Math.floor(score/10)}m | NOTES: ${notesCollected}`;
    document.getElementById('game-over').style.display = 'block';
}

spawn();
update();
</script>
</body>
</html>
