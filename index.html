<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sanco's Great Escape - Wild Update</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Courier New', Courier, monospace; color: white; }
        canvas { display: block; background: #87CEEB; }
        #ui { position: absolute; top: 20px; left: 20px; font-size: 20px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; }
        #game-over {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); padding: 30px; border: 4px solid #d4af37;
            text-align: center; display: none; width: 350px; box-shadow: 0 0 20px #000;
        }
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-weight: bold; text-decoration: none; cursor: pointer; border: none; font-size: 16px; text-transform: uppercase; }
        .yt-btn { background: #ff0000; color: white; }
        .esofa-btn { background: #d4af37; color: black; }
        .retry-btn { background: #555; color: #fff; }
    </style>
</head>
<body>

<div id="ui">
    DIST: <span id="dist">0</span>m | BEST: <span id="best">0</span>m<br>
    NOTES: <span id="notes">0</span>
</div>

<div id="game-over">
    <h1 style="color:#d4af37; margin-top:0;">RESCUE NEEDED!</h1>
    <p id="final-stats"></p>
    <p id="new-record" style="color: #32cd32; font-weight: bold; display: none;">NEW LOCAL RECORD!</p>
    <hr border="1" color="#333">
    <a class="btn yt-btn" href="https://www.youtube.com/@SancoOutdoors" target="_blank">🎬 SUB TO SANCO</a>
    <a class="btn esofa-btn" href="https://www.sanangelogives.org/organization/emmanuelschooloffinearts" target="_blank">🎻 TIP ESOFA</a>
    <button class="btn retry-btn" onclick="location.reload()">RETRY</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let notesCollected = 0;
let gameActive = true;
let speed = 8;
let frame = 0;
let highScore = localStorage.getItem('sanco_best') || 0;
document.getElementById('best').innerText = Math.floor(highScore/10);

const groundY = canvas.height - 100;
const player = { x: 80, y: groundY - 60, w: 40, h: 60, dy: 0, jump: -16, onGround: false };
const obstacles = [];
const notes = [];

window.addEventListener('keydown', (e) => {
    if ((e.code === 'Space' || e.code === 'ArrowUp') && player.onGround) {
        player.dy = player.jump;
        player.onGround = false;
    }
});

function drawExplorer(x, y) {
    ctx.fillStyle = "#ffdbac"; 
    ctx.fillRect(x + 10, y, 20, 20); 
    ctx.fillStyle = "#5d4037"; 
    ctx.fillRect(x + 5, y, 30, 5);
    ctx.fillRect(x + 10, y - 5, 20, 10);
    ctx.fillStyle = "#2e7d32"; 
    ctx.fillRect(x + 8, y + 20, 24, 25);
    ctx.fillStyle = "#3e2723"; 
    let walk = Math.sin(frame * 0.2) * 5;
    ctx.fillRect(x + 8, y + 45, 10, 15 + walk); 
    ctx.fillRect(x + 22, y + 45, 10, 15 - walk);
}

function spawn() {
    if (!gameActive) return;
    
    if (Math.random() < 0.02) {
        let rand = Math.random();
        if (rand < 0.3) {
            obstacles.push({ x: canvas.width, y: groundY - 80, w: 30, h: 80, type: 'tree' });
        } else if (rand < 0.5) {
            obstacles.push({ x: canvas.width, y: groundY - 140, w: 40, h: 20, type: 'bird' });
        } else if (rand < 0.75) {
            obstacles.push({ x: canvas.width, y: groundY, w: 80, h: 20, type: 'water' });
        } else {
            obstacles.push({ x: canvas.width, y: groundY - 200, w: 60, h: 15, type: 'branch' });
        }
    }

    if (Math.random() < 0.01) {
        notes.push({ x: canvas.width, y: groundY - 180, r: 12 });
    }
    setTimeout(spawn, 100);
}

function update() {
    if (!gameActive) return;
    frame++;
    score++;
    speed += 0.002;
    document.getElementById('dist').innerText = Math.floor(score/10);
    document.getElementById('notes').innerText = notesCollected;

    player.dy += 0.8;
    player.y += player.dy;

    // Standard ground collision (except for water)
    if (player.y > groundY - player.h) {
        player.y = groundY - player.h;
        player.dy = 0;
        player.onGround = true;
    }

    obstacles.forEach((obs, i) => {
        obs.x -= speed;
        
        // Custom collision for water pits (only if player is on the ground)
        if (obs.type === 'water') {
            if (player.x + 20 > obs.x && player.x + 20 < obs.x + obs.w && player.y >= groundY - player.h) {
                endGame();
            }
        } else {
            // Box collision for everything else
            if (player.x < obs.x + obs.w - 5 && player.x + player.w - 5 > obs.x &&
                player.y < obs.y + obs.h && player.y + player.h > obs.y) {
                endGame();
            }
        }
        if (obs.x < -150) obstacles.splice(i, 1);
    });

    notes.forEach((n, i) => {
        n.x -= speed;
        if (Math.abs(player.x - n.x) < 40 && Math.abs(player.y - n.y) < 60) {
            notesCollected++;
            notes.splice(i, 1);
        }
    });

    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grass Ground
    ctx.fillStyle = '#228B22';
    ctx.fillRect(0, groundY, canvas.width, 100);

    drawExplorer(player.x, player.y);

    obstacles.forEach(obs => {
        if (obs.type === 'tree') {
            ctx.fillStyle = '#5d4037'; ctx.fillRect(obs.x + 10, obs.y + 40, 10, 40);
            ctx.fillStyle = '#1b5e20'; ctx.beginPath();
            ctx.moveTo(obs.x - 10, obs.y + 45); ctx.lineTo(obs.x + 15, obs.y); ctx.lineTo(obs.x + 40, obs.y + 45); ctx.fill();
        } else if (obs.type === 'bird') {
            ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.beginPath();
            let wng = Math.sin(frame * 0.3) * 10;
            ctx.moveTo(obs.x, obs.y); ctx.lineTo(obs.x+20, obs.y+wng); ctx.lineTo(obs.x+40, obs.y); ctx.stroke();
        } else if (obs.type === 'water') {
            ctx.fillStyle = '#00ffff'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
        } else if (obs.type === 'branch') {
            ctx.fillStyle = '#5d4037'; ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
            ctx.fillStyle = '#2e7d32'; ctx.fillRect(obs.x + 10, obs.y + 10, 20, 10);
        }
    });

    ctx.fillStyle = '#d4af37';
    notes.forEach(n => { ctx.font = "24px Arial"; ctx.fillText("♪", n.x, n.y); });
}

function endGame() {
    gameActive = false;
    if (score > highScore) {
        localStorage.setItem('sanco_best', score);
        document.getElementById('new-record').style.display = 'block';
    }
    document.getElementById('final-stats').innerText = `DIST: ${Math.floor(score/10)}m | NOTES: ${notesCollected}`;
    document.getElementById('game-over').style.display = 'block';
}

spawn();
update();
</script>
</body>
</html>
